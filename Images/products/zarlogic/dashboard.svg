<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 504" width="840" height="504" style="background:#0F172A; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14243A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#172234" />
    </linearGradient>
  </defs>

  <!-- Top App Bar -->
  <rect x="0" y="0" width="840" height="46" fill="#14243A" stroke="#334155" stroke-width="1"/>
  <rect x="20" y="11" width="24" height="24" rx="6" fill="#059669"/>
  <path d="M32 17v12 M28 21l4-4 4 4" stroke="#FFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="52" y="27" fill="#F8FAFC" font-size="14" font-weight="700" letter-spacing="-0.01em">ZarLogic</text>
  <text x="114" y="27" fill="#64748B" font-size="12">|</text>
  <text x="124" y="27" fill="#94A3B8" font-size="12" font-weight="500">Farm Dashboard</text>

  <!-- Status / Pill -->
  <rect x="670" y="12" width="90" height="22" rx="11" fill="#064E3B" stroke="#059669" stroke-width="1"/>
  <circle cx="682" cy="23" r="3.5" fill="#10B981"/>
  <text x="692" y="27" fill="#34D399" font-size="10.5" font-weight="600">Rabi Season</text>
  <rect x="770" y="12" width="50" height="22" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="795" y="27" text-anchor="middle" fill="#CBD5E1" font-size="10.5" font-weight="600">EN · سنڌي</text>

  <!-- Canvas -->
  <g transform="translate(24, 62)">
    
  <!-- KPI Row -->
  <rect x="0" y="0" width="186" height="74" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
  <text x="14" y="22" fill="#94A3B8" font-size="11" font-weight="500">Total Cultivated Area</text>
  <text x="14" y="52" fill="#F8FAFC" font-size="22" font-weight="700">350 <tspan font-size="13" fill="#64748B" font-weight="500">Acres</tspan></text>

  <rect x="202" y="0" width="186" height="74" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
  <text x="216" y="22" fill="#94A3B8" font-size="11" font-weight="500">Active Permanent Labor</text>
  <text x="216" y="52" fill="#F8FAFC" font-size="22" font-weight="700">14 <tspan font-size="13" fill="#34D399" font-weight="500">100% Assigned</tspan></text>

  <rect x="404" y="0" width="186" height="74" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
  <text x="418" y="22" fill="#94A3B8" font-size="11" font-weight="500">Input Inventory</text>
  <text x="418" y="52" fill="#F8FAFC" font-size="22" font-weight="700">420 <tspan font-size="13" fill="#60A5FA" font-weight="500">Bags in Stock</tspan></text>

  <rect x="606" y="0" width="186" height="74" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
  <text x="620" y="22" fill="#94A3B8" font-size="11" font-weight="500">Harvest Logged</text>
  <text x="620" y="52" fill="#F8FAFC" font-size="22" font-weight="700">850 <tspan font-size="13" fill="#FBBF24" font-weight="500">Maund (Wheat)</tspan></text>

  <!-- Table Card -->
  <rect x="0" y="90" width="792" height="324" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
  <text x="20" y="118" fill="#F8FAFC" font-size="14" font-weight="600">Active Field Operations &amp; Crop Allocations</text>

  <g transform="translate(20, 136)" font-size="11">
    <rect x="0" y="0" width="752" height="28" rx="4" fill="#0F172A"/>
    <text x="14" y="18" fill="#64748B" font-weight="600">FIELD / BLOCK</text>
    <text x="160" y="18" fill="#64748B" font-weight="600">ASSIGNED LABOR</text>
    <text x="320" y="18" fill="#64748B" font-weight="600">CROP &amp; ACRES</text>
    <text x="480" y="18" fill="#64748B" font-weight="600">REVENUE RATIO</text>
    <text x="640" y="18" fill="#64748B" font-weight="600">STATUS</text>

    <!-- Row 1 -->
    <line x1="0" y1="36" x2="752" y2="36" stroke="#334155" stroke-width="1"/>
    <text x="14" y="58" fill="#F8FAFC" font-weight="600">Field 1 — Canal Bank</text>
    <text x="160" y="58" fill="#CBD5E1">Ghulam Ali Solangi</text>
    <text x="320" y="58" fill="#CBD5E1">Wheat (25 Acres)</text>
    <text x="480" y="58" fill="#60A5FA" font-family="monospace">50% Owner / 50% Labor</text>
    <rect x="640" y="44" width="60" height="20" rx="10" fill="#064E3B"/><text x="670" y="58" text-anchor="middle" fill="#34D399" font-size="10" font-weight="600">ACTIVE</text>

    <!-- Row 2 -->
    <line x1="0" y1="76" x2="752" y2="76" stroke="#334155" stroke-width="1"/>
    <text x="14" y="98" fill="#F8FAFC" font-weight="600">Field 2 — Tube-well North</text>
    <text x="160" y="98" fill="#CBD5E1">Nawaz Khan Lund</text>
    <text x="320" y="98" fill="#CBD5E1">Wheat (30 Acres)</text>
    <text x="480" y="98" fill="#60A5FA" font-family="monospace">50% Owner / 50% Labor</text>
    <rect x="640" y="84" width="60" height="20" rx="10" fill="#064E3B"/><text x="670" y="98" text-anchor="middle" fill="#34D399" font-size="10" font-weight="600">ACTIVE</text>

    <!-- Row 3 -->
    <line x1="0" y1="116" x2="752" y2="116" stroke="#334155" stroke-width="1"/>
    <text x="14" y="138" fill="#F8FAFC" font-weight="600">Field 3 — Railway Block</text>
    <text x="160" y="138" fill="#CBD5E1">Ali Asghar</text>
    <text x="320" y="138" fill="#CBD5E1">Mustard (20 Acres)</text>
    <text x="480" y="138" fill="#60A5FA" font-family="monospace">50% Owner / 50% Labor</text>
    <rect x="640" y="124" width="60" height="20" rx="10" fill="#064E3B"/><text x="670" y="138" text-anchor="middle" fill="#34D399" font-size="10" font-weight="600">ACTIVE</text>

    <!-- Row 4 -->
    <line x1="0" y1="156" x2="752" y2="156" stroke="#334155" stroke-width="1"/>
    <text x="14" y="178" fill="#F8FAFC" font-weight="600">Field 4 — West Orchard</text>
    <text x="160" y="178" fill="#94A3B8" font-style="italic">Unassigned</text>
    <text x="320" y="178" fill="#94A3B8">Fallow (15 Acres)</text>
    <text x="480" y="178" fill="#64748B">—</text>
    <rect x="640" y="164" width="60" height="20" rx="10" fill="#451A03"/><text x="670" y="178" text-anchor="middle" fill="#FBBF24" font-size="10" font-weight="600">VACANT</text>
  </g>

  </g>
</svg>