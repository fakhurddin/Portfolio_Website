    <text x="160" y="98" fill="#F8FAFC" font-weight="600">DAP Fertilizer (Engro)</text>
    <text x="310" y="98" fill="#F8FAFC">15 Bags</text>
    <text x="420" y="98" fill="#60A5FA" font-family="monospace">750 KG</text>
