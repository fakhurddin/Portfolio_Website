  <rect x="770" y="12" width="50" height="22" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="795" y="27" text-anchor="middle" fill="#CBD5E1" font-size="10.5" font-weight="600">EN · سنڌي</text>

  <!-- Canvas -->
  <g transform="translate(24, 62)">
    
  <rect x="0" y="0" width="792" height="414" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
  <text x="20" y="32" fill="#F8FAFC" font-size="15" font-weight="600">Final Labor Settlement Breakdown · Season 2026</text>
  <text x="20" y="52" fill="#94A3B8" font-size="12">Permanent Labor: Ghulam Ali Solangi · Field: Block A (North Canal) · Crop: Wheat</text>

  <g transform="translate(20, 72)" font-size="12">
    <!-- Component lines -->
    <rect x="0" y="0" width="752" height="34" rx="4" fill="#0F172A"/>
    <text x="20" y="22" fill="#CBD5E1">1. Gross Crop Revenue Share (50% of PKR 1,680,000)</text>
    <text x="620" y="22" fill="#34D399" font-weight="700" font-family="monospace">+ PKR 840,000</text>

    <rect x="0" y="44" width="752" height="34" rx="4" fill="#0F172A"/>
    <text x="20" y="66" fill="#CBD5E1">2. Expense Responsibility Deduction (40% of Shared Inputs)</text>
    <text x="620" y="66" fill="#F87171" font-weight="700" font-family="monospace">− PKR 124,500</text>

    <rect x="0" y="88" width="752" height="34" rx="4" fill="#0F172A"/>
