    <text x="24" y="214" fill="#A7F3D0" font-size="14" font-weight="700">NET PAYABLE TO LABOR (HARI):</text>
    <text x="610" y="216" fill="#FFFFFF" font-size="18" font-weight="800" font-family="monospace">PKR 679,500</text>
