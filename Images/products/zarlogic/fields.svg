    <text x="560" y="18" fill="#64748B" font-weight="600">EFFECTIVE FROM</text>
    <text x="670" y="18" fill="#64748B" font-weight="600">STATE</text>

    <line x1="0" y1="36" x2="752" y2="36" stroke="#334155" stroke-width="1"/>
