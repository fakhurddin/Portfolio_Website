    <text x="160" y="58" fill="#CBD5E1">25.0 Acres</text>
    <text x="270" y="58" fill="#A7F3D0">Connected</text>
    <text x="400" y="58" fill="#F8FAFC">Ghulam Ali</text>
    <text x="560" y="58" fill="#94A3B8">01 Jul 2026</text>
    <rect x="670" y="44" width="62" height="20" rx="10" fill="#064E3B"/><text x="701" y="58" text-anchor="middle" fill="#34D399" font-size="10" font-weight="600">ACTIVE</text>

    <line x1="0" y1="76" x2="752" y2="76" stroke="#334155" stroke-width="1"/>
    <text x="14" y="98" fill="#F8FAFC" font-weight="600">Block B (Tube-well)</text>
    <text x="160" y="98" fill="#CBD5E1">30.0 Acres</text>
    <text x="270" y="98" fill="#A7F3D0">Connected</text>
    <text x="400" y="98" fill="#F8FAFC">Nawaz Khan</text>
    <text x="560" y="98" fill="#94A3B8">15 Jul 2026</text>
    <rect x="670" y="84" width="62" height="20" rx="10" fill="#064E3B"/><text x="701" y="98" text-anchor="middle" fill="#34D399" font-size="10" font-weight="600">ACTIVE</text>

    <line x1="0" y1="116" x2="752" y2="116" stroke="#334155" stroke-width="1"/>
    <text x="14" y="138" fill="#F8FAFC" font-weight="600">Block C (Roadside)</text>
    <text x="160" y="138" fill="#CBD5E1">20.0 Acres</text>
    <text x="270" y="138" fill="#FED7AA">Separate</text>
    <text x="400" y="138" fill="#F8FAFC">Liaquat Ali</text>
    <text x="560" y="138" fill="#94A3B8">01 Aug 2026</text>
    <rect x="670" y="124" width="62" height="20" rx="10" fill="#064E3B"/><text x="701" y="138" text-anchor="middle" fill="#34D399" font-size="10" font-weight="600">ACTIVE</text>

    <line x1="0" y1="156" x2="752" y2="156" stroke="#334155" stroke-width="1"/>
    <text x="14" y="178" fill="#F8FAFC" font-weight="600">Block D (Riverbed)</text>
    <text x="160" y="178" fill="#CBD5E1">15.0 Acres</text>
    <text x="270" y="178" fill="#FED7AA">Separate</text>
    <text x="400" y="178" fill="#94A3B8" font-style="italic">Vacant</text>
    <text x="560" y="178" fill="#94A3B8">—</text>
    <rect x="670" y="164" width="62" height="20" rx="10" fill="#451A03"/><text x="701" y="178" text-anchor="middle" fill="#FBBF24" font-size="10" font-weight="600">VACANT</text>
